apply plugin: 'com.android.library'

android {
    namespace 'com.androlua'
    compileSdk rootProject.ext.compile_sdk

    // Lua 解释器与各原生模块改为随工程一起从源码编译，源码在 src/main/jni
    ndkVersion rootProject.ext.ndk_version

    defaultConfig {
        minSdk rootProject.ext.min_sdk
        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=$projectDir/src/main/jni/Application.mk"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP 9 起 proguard-android.txt 因内含 -dontoptimize 已不再支持
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
        debug {
            minifyEnabled false
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 原来这里是 AndroLua+5.0.22_xbm_AndroidX.jar —— 一个混淆过的预编译包，
    // 出了问题既看不到源码也改不动。现已换成 AndroLua_Pro_Plus 的源码，
    // 顺带甩掉 jar 里捆的 Baidu 移动统计（原 LuaActivity.onCreate/onResume/
    // onPause 和 Main 都会调 StatService）和一整套用不上的 BeanShell。
    //
    // commons-compress 和 JsoupXpath 曾经也在这里：前者只被
    // com.androlua.util.ArcZipUtil 用，后者只被 com.androlua.util.XpathUtil 用，
    // 这两个类全工程无人引用、也没有任何 .lua 脚本按名字取用，已随之删除。
    // 少掉的不只是两个依赖 —— commons-compress 原本必须钉死在 1.21
    // （它的 utils.IOUtils 在 1.26 被删掉），这条版本约束也一并没有了。
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_version"
}
