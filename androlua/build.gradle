apply plugin: 'com.android.library'

android {
    namespace 'com.androlua'
    compileSdk rootProject.ext.compile_sdk

    // Lua 解释器与各原生模块改为随工程一起从源码编译，源码在 src/main/jni
    ndkVersion rootProject.ext.ndk_version

    defaultConfig {
        minSdk rootProject.ext.min_sdk
        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=$projectDir/src/main/jni/Application.mk"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP 9 起 proguard-android.txt 因内含 -dontoptimize 已不再支持
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
        debug {
            minifyEnabled false
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // AndroLua+ 5.0.22 预编译 jar（上游未公开该版本源码，只能整包引入）
    api fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_version"
}
