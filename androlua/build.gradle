apply plugin: 'com.android.library'

android {
    namespace 'com.androlua'
    compileSdk rootProject.ext.compile_sdk

    defaultConfig {
        minSdk rootProject.ext.min_sdk
        // 与随附的 AndroLua+ jar / libluajava.so 版本保持一致
        versionCode 1199
        versionName "5.0.22(armeabi-v7a,arm64-v8a)"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // jniLibs 只提供 armeabi-v7a / arm64-v8a，原先声明的 x86 并无对应 .so
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
        debug {
            minifyEnabled false
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // AndroLua+ 5.0.22 预编译 jar（上游未公开该版本源码，只能整包引入）
    api fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_version"
}
