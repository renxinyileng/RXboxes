apply plugin: 'com.android.library'

android {
    namespace 'com.androlua'
    compileSdk rootProject.ext.compile_sdk

    // Lua 解释器与各原生模块改为随工程一起从源码编译，源码在 src/main/jni
    ndkVersion rootProject.ext.ndk_version

    defaultConfig {
        minSdk rootProject.ext.min_sdk
        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK:=$projectDir/src/main/jni/Application.mk"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP 9 起 proguard-android.txt 因内含 -dontoptimize 已不再支持
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
        debug {
            minifyEnabled false
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 原来这里是 AndroLua+5.0.22_xbm_AndroidX.jar —— 一个混淆过的预编译包，
    // 出了问题既看不到源码也改不动。现已换成 AndroLua_Pro_Plus 的源码
    // （src/main/java 下 460 个文件），顺带甩掉 jar 里捆的 Baidu 移动统计
    // （原 LuaActivity.onCreate/onResume/onPause 和 Main 都会调 StatService）
    // 和一整套用不上的 BeanShell。
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_version"

    // AndroLua_Pro_Plus 源码自身的编译期依赖，只有这两个是被直接 import 的：
    //   commons-compress —— LuaUtil/WriteTask 的 zip 读写
    //   JsoupXpath       —— com.androlua.util.XpathUtil（连带把 jsoup、
    //                       commons-io 作为传递依赖带进来，无需显式声明）
    api "org.apache.commons:commons-compress:$rootProject.ext.commons_compress_version"
    api "cn.wanghaomiao:JsoupXpath:$rootProject.ext.jsoupxpath_version"
}
