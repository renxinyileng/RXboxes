buildscript {
    ext {
        // Android Gradle Plugin
        agp_version = '9.3.1'

        // 编译环境
        // Glide 5 / Material 1.14 等最新依赖要求 compileSdk >= 37
        compile_sdk = 37
        // Material 1.14 要求 minSdk >= 23（Android 6.0）
        min_sdk = 23
        // 保持 29：本工程大量 Lua 脚本直接读写外部存储，
        // 依赖 requestLegacyExternalStorage，提到 30+ 会触发分区存储导致功能失效。
        target_sdk = 29

        // 编译 Lua 解释器等原生模块用的 NDK（GitHub Actions 镜像自带该版本）
        ndk_version = '27.3.13750724'

        // 依赖版本
        appcompat_version = '1.7.1'
        material_version = '1.14.0'
        swiperefreshlayout_version = '1.2.0'
        pdfviewpager_version = '1.1.3'
        aliyun_player_version = '7.16.0-full'
        tbssdk_version = '44286'
        okhttp_version = '3.14.9'
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
    }
}

/*
 * 阿里云镜像只保留给确实取不到别处的两个依赖，并用 content 限定分组：
 * 不限定的话每个依赖都会先去问一遍阿里云，在 GitHub 的海外 runner 上
 * 经常拖慢甚至卡住整个解析过程（构建时间从 3 分钟涨到 30 分钟以上）。
 */
allprojects {
    repositories {
        google()
        mavenCentral()

        // PdfViewPager 只发布在 jcenter，用阿里云镜像获取
        maven {
            url 'https://maven.aliyun.com/repository/jcenter'
            content { includeGroup 'es.voghdev.pdfviewpager' }
        }
        // 阿里云播放器 SDK
        maven {
            url 'https://maven.aliyun.com/repository/releases'
            content { includeGroupByRegex 'com\\.aliyun.*' }
        }
        maven {
            url 'https://maven.aliyun.com/repository/public'
            content { includeGroupByRegex 'com\\.aliyun.*' }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
