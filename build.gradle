buildscript {
    ext {
        // Android Gradle Plugin
        agp_version = '9.3.1'

        // 编译环境
        // Glide 5 / Material 1.14 等最新依赖要求 compileSdk >= 37
        compile_sdk = 37
        // Material 1.14 要求 minSdk >= 23（Android 6.0）
        min_sdk = 23
        // 保持 29：本工程大量 Lua 脚本直接读写外部存储，
        // 依赖 requestLegacyExternalStorage，提到 30+ 会触发分区存储导致功能失效。
        target_sdk = 29

        // 编译 Lua 解释器等原生模块用的 NDK（GitHub Actions 镜像自带该版本）
        ndk_version = '27.3.13750724'

        // 依赖版本
        appcompat_version = '1.7.1'
        material_version = '1.14.0'
        constraintlayout_version = '2.2.2'
        pdfviewpager_version = '1.1.3'
        aliyun_player_version = '7.16.0-full'
        tbssdk_version = '44286'
        okhttp_version = '3.14.9'
        jsoup_version = '1.23.1'
        zip4j_version = '2.11.6'
        glide_version = '5.0.9'
    }

    repositories {
        google()
        mavenCentral()
        // PdfViewPager 只发布在 jcenter，通过阿里云镜像获取
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        // 阿里云播放器 SDK
        maven { url 'https://maven.aliyun.com/repository/releases' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/releases' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
