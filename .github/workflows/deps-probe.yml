name: 探测依赖最新版本

# 临时工作流：本地网络无法访问 dl.google.com / maven.aliyun.com，
# 借助 GitHub Actions 查询各依赖的最新版本，确定升级目标后即可删除。
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths:
      - ".github/workflows/deps-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Android Gradle Plugin 8.x / 9.x 稳定版
        continue-on-error: true
        run: |
          curl -s https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | grep -oE '<version>[^<]+</version>' | grep -vE 'alpha|beta|rc|dev' | tail -20

      - name: 阿里云播放器 SDK
        continue-on-error: true
        run: |
          for repo in releases public jcenter; do
            echo "### maven.aliyun.com/repository/$repo"
            curl -s "https://maven.aliyun.com/repository/$repo/com/aliyun/sdk/android/AliyunPlayer/maven-metadata.xml" \
              | grep -oE '<version>[^<]+</version>' | tail -12
          done

      - name: 腾讯 TBS SDK
        continue-on-error: true
        run: |
          for repo in releases public jcenter; do
            echo "### maven.aliyun.com/repository/$repo"
            curl -s "https://maven.aliyun.com/repository/$repo/com/tencent/tbs/tbssdk/maven-metadata.xml" \
              | grep -oE '<version>[^<]+</version>' | tail -12
          done
          echo "### repo1"
          curl -s "https://repo1.maven.org/maven2/com/tencent/tbs/tbssdk/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | tail -12

      - name: PdfViewPager（仅 jcenter 有）
        continue-on-error: true
        run: |
          for repo in jcenter public releases; do
            echo "### maven.aliyun.com/repository/$repo"
            curl -s "https://maven.aliyun.com/repository/$repo/es/voghdev/pdfviewpager/library/maven-metadata.xml" \
              | grep -oE '<version>[^<]+</version>' | tail -12
          done
          echo "### jitpack com.github.voghDev:PdfViewPager"
          curl -s "https://jitpack.io/com/github/voghDev/PdfViewPager/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | tail -12

      - name: 构建环境自带的 SDK / NDK / JDK
        continue-on-error: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null
          echo "--- ndk ---"; ls "$ANDROID_HOME/ndk" 2>/dev/null
          echo "--- java ---"; java -version 2>&1
          ls /usr/lib/jvm 2>/dev/null
