name: 编译 aria2 下载核心

# 交叉编译 libaria2 + JNI 封装，产出 libaria2jni.so。
# 编译很重（OpenSSL + aria2），所以不挂在 APK 构建流程上，
# 按需手动触发或在相关源码改动时触发，产物以 artifact 形式取回，
# 再放进 app/src/main/jniLibs/<abi>/。
on:
  push:
    branches: [ "main", "claude/**" ]
    paths:
      - "native/aria2/**"
      - ".github/workflows/aria2.yml"
  workflow_dispatch:
    inputs:
      abis:
        description: "要编译的 ABI（空格分隔）"
        default: "arm64-v8a"

concurrency:
  group: aria2-${{ github.ref }}
  cancel-in-progress: true

# 编好的 so 要提交回分支
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 autotools
        # aria2 用了 AM_GNU_GETTEXT，autoreconf 需要 gettext 提供的 autopoint
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config gettext autopoint

      - name: 选择 NDK
        id: ndk
        run: |
          NDK="$ANDROID_HOME/ndk/27.3.13750724"
          [ -d "$NDK" ] || NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          echo "使用 $NDK"
          echo "path=$NDK" >> "$GITHUB_OUTPUT"

      - name: 交叉编译
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.path }}
        run: |
          set -o pipefail
          chmod +x native/aria2/build.sh
          # 只编 arm64-v8a：app/build.gradle 的 abiFilters 也只打包这一个
          ABIS="${{ github.event.inputs.abis }}"
          [ -z "$ABIS" ] && ABIS="arm64-v8a"
          ./native/aria2/build.sh $ABIS 2>&1 | tee /tmp/aria2-build.log

      - name: 错误摘要
        if: always()
        run: |
          echo "===== error 行 ====="
          grep -nE "(error|Error|fatal error|No such file):" /tmp/aria2-build.log | tail -40 || echo "（无）"

      - name: 校验产物
        run: |
          set -euo pipefail
          for d in native/aria2/out/*; do
            abi="$(basename "$d")"
            so="$d/libaria2jni.so"
            [ -f "$so" ] || { echo "::error::$abi 未产出 libaria2jni.so"; exit 1; }
            echo "### $abi  $(stat -c%s "$so") 字节"
            # JNI 入口必须齐全
            for sym in nativeStart nativeStop nativeIsRunning; do
              nm -D --defined-only "$so" | grep -q "Java_com_rxteam_aria2_Aria2_$sym" \
                || { echo "::error::$abi 缺少导出 $sym"; exit 1; }
            done
            # 不能残留对宿主机库的未定义依赖
            echo "-- NEEDED:"; readelf -d "$so" | grep NEEDED
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aria2jni
          path: native/aria2/out/**/libaria2jni.so

      # 产物直接落进 jniLibs 并提交回本分支，APK 构建才拿得到。
      # jniLibs 不在本工作流的 paths 里，这次提交不会再触发自己。
      - name: 提交 so 到 app/src/main/jniLibs
        run: |
          set -euo pipefail
          for d in native/aria2/out/*; do
            abi="$(basename "$d")"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$d/libaria2jni.so" "app/src/main/jniLibs/$abi/libaria2jni.so"
          done
          git add app/src/main/jniLibs
          if git diff --cached --quiet; then
            echo "so 无变化，不提交"
            exit 0
          fi
          git -c user.name="Claude" -c user.email="noreply@anthropic.com" \
            commit -m "build(aria2): 更新 libaria2jni.so（由 aria2 工作流编译）" \
                   -m "来自 ${{ github.sha }} 的构建产物。"
          git push origin "HEAD:${{ github.ref_name }}"
