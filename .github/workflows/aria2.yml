name: 编译 aria2 下载核心

# 交叉编译 libaria2 + JNI 封装，产出 libaria2jni.so。
#
# 两个引擎并行构建、各自校验：
#   next      aria2-next v2.5.5（默认，当前发布用的就是它）
#   upstream  aria2 1.37.0（上游已停更，保留作为保底路径）
#
# 构建与发布是分开的：push 只构建+校验+传 artifact，不动仓库里的 so。
# 要更新 app/src/main/jniLibs/ 得手动触发并显式选择 publish 的引擎。
on:
  push:
    branches: [ "main", "claude/**" ]
    paths:
      - "native/aria2/**"
      - ".github/workflows/aria2.yml"
  workflow_dispatch:
    inputs:
      abis:
        description: "要编译的 ABI（空格分隔）"
        default: "arm64-v8a"
      publish:
        description: "把哪个引擎的 so 提交回 jniLibs"
        default: "none"
        type: choice
        options: [ "none", "upstream", "next" ]

concurrency:
  group: aria2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # next 编不过时不能连带取消 upstream —— upstream 是保底路径
      fail-fast: false
      matrix:
        engine: [ upstream, next ]
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        # upstream 走 autotools（aria2 用了 AM_GNU_GETTEXT，autoreconf 需要 autopoint）
        # next 走 CMake + Ninja；两套一起装，省掉条件判断
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gettext autopoint cmake ninja-build

      - name: 检查 CMake 版本
        if: matrix.engine == 'next'
        run: |
          need=3.25.0
          have="$(cmake --version | head -1 | awk '{print $3}')"
          echo "cmake $have（aria2-next 要求 >= $need）"
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] \
            || { echo "::error::cmake $have 低于 $need"; exit 1; }

      - name: 选择 NDK
        id: ndk
        run: |
          NDK="$ANDROID_HOME/ndk/27.3.13750724"
          [ -d "$NDK" ] || NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          echo "使用 $NDK  ($(grep Pkg.Revision "$NDK/source.properties" || true))"
          echo "path=$NDK" >> "$GITHUB_OUTPUT"

      - name: 交叉编译
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.path }}
          ARIA2_ENGINE: ${{ matrix.engine }}
        run: |
          set -o pipefail
          chmod +x native/aria2/build.sh native/aria2/verify.sh
          ABIS="${{ github.event.inputs.abis }}"
          [ -z "$ABIS" ] && ABIS="arm64-v8a"
          ./native/aria2/build.sh $ABIS 2>&1 | tee "/tmp/build-${{ matrix.engine }}.log"

      - name: 错误摘要
        if: failure()
        run: |
          echo "===== error 行 ====="
          grep -nE "(error|Error|fatal error|No such file):" "/tmp/build-${{ matrix.engine }}.log" | tail -40 || echo "（无）"

      - name: 校验产物
        run: |
          set -euo pipefail
          for d in native/aria2/out/${{ matrix.engine }}/*; do
            ./native/aria2/verify.sh "$d/libaria2jni.so" "${{ matrix.engine }}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aria2jni-${{ matrix.engine }}
          path: native/aria2/out/${{ matrix.engine }}/**/libaria2jni.so

  # 宿主机上把引擎真跑起来，对着真实的 aria2.conf 走一遍 AriaNg 的全部
  # JSON-RPC 调用。交叉编译产物在 CI 里跑不了，静态检查也证明不了
  # "conf-path 经 sessionNew 真的生效"，只能靠这个。
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libssl-dev zlib1g-dev libexpat1-dev jq
      - name: 宿主机 RPC 探针
        env:
          ARIA2_ENGINE: next
        run: |
          chmod +x native/aria2/host-probe.sh
          ./native/aria2/host-probe.sh

  # 只有手动触发并显式指定引擎时才更新仓库里的 so。
  # 这样"编出来并验证通过"和"发布给用户"是两件事，回滚只需 revert 一个提交。
  publish:
    # 探针也必须绿：光编出来不够，得证明它真能服务 AriaNg
    needs: [ build, probe ]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aria2jni-${{ github.event.inputs.publish }}
          path: incoming

      - name: 提交 so 到 app/src/main/jniLibs
        run: |
          set -euo pipefail
          find incoming -name libaria2jni.so | while read -r so; do
            abi="$(basename "$(dirname "$so")")"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "$so" "app/src/main/jniLibs/$abi/libaria2jni.so"
            echo "更新 $abi ($(stat -c%s "$so") 字节)"
          done
          git add app/src/main/jniLibs
          if git diff --cached --quiet; then
            echo "so 无变化，不提交"
            exit 0
          fi
          git -c user.name="Claude" -c user.email="noreply@anthropic.com" \
            commit -m "build(aria2): 更新 libaria2jni.so（引擎 ${{ github.event.inputs.publish }}）" \
                   -m "来自 ${{ github.sha }} 的构建产物。"
          git push origin "HEAD:${{ github.ref_name }}"
