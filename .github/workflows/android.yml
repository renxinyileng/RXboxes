name: 构建APK

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 授予执行运行gradlew权限
        run: chmod +x gradlew

      - name: 使用Gradle构建
        run: ./gradlew assembleDebug assembleRelease --console=plain

      # aria2 下载核心和 Lua 解释器都是 native 库，没打进 APK 的话
      # 装上去才会发现，所以在这里直接查 APK 里到底有没有
      - name: 校验 native 库已打进 APK
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "检查 $APK"
          LIBS="$(unzip -Z1 "$APK" 'lib/*' || true)"
          echo "$LIBS" | sed 's/^/  /'
          for want in lib/arm64-v8a/libaria2jni.so lib/arm64-v8a/libluajava.so; do
            echo "$LIBS" | grep -qx "$want" \
              || { echo "::error::APK 里缺少 $want"; exit 1; }
            echo "✅ $want"
          done

          # AndroLua 的 Lua C 模块靠 require 走 package.cpath 找 so，那是文件
          # 系统路径，所以 so 必须解压到 nativeLibraryDir。extractNativeLibs
          # 一旦变成 false，System.loadLibrary 还能用但 require 全线失败，
          # main.lua 第 11 行就中断 —— 装到机器上才看得出来，必须在这里拦。
          echo "-- extractNativeLibs"
          AAPT="$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          if "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" \
               | grep -q 'extractNativeLibs.*=.*true'; then
            echo "✅ extractNativeLibs=true（so 会解压到 nativeLibraryDir）"
          else
            echo "::error::extractNativeLibs 不是 true —— Lua 的 require 将找不到 libsocket.so 等模块"
            exit 1
          fi

          # Android 15 起设备可能用 16KB 内存页，未按 16KB 对齐的 so 会加载失败。
          # 少一个都可能让整个 App 起不来，所以逐个查 LOAD 段的对齐。
          echo "-- 16KB 页对齐"
          rm -rf /tmp/apklibs && mkdir -p /tmp/apklibs
          unzip -q -o "$APK" 'lib/*' -d /tmp/apklibs
          bad=0
          while read -r so; do
            aligns="$(readelf -lW "$so" | awk '/LOAD/{print $NF}' | sort -u)"
            if echo "$aligns" | grep -qv '0x4000'; then
              echo "::error::$(basename "$so") 对齐为 $(echo $aligns) —— 需要 0x4000(16KB)"
              bad=1
            fi
          done < <(find /tmp/apklibs -name '*.so')
          [ $bad -eq 0 ] && echo "✅ 全部 $(find /tmp/apklibs -name '*.so' | wc -l) 个 so 均为 16KB 对齐" || exit 1

      # 仓库配置了签名 secret 时才签名，否则仅做构建校验
      - name: 检查签名配置
        id: check_key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置 KEYSTORE secret，跳过签名步骤。"
          fi

      # 直接调用 build-tools 里的 zipalign / apksigner，
      # 把 APK 里的 .lua 脚本换成密文。必须在签名之前做：这样签名覆盖的是
      # 密文，装到机器上磁盘里也只有密文，运行时由 libluajava 的
      # luaL_loadfilex/luaL_loadbufferx 在内存里解密（见 jni/lua/luaenc.c）。
      # 算法与密钥同源自 luaenc.c，pack.py 直接解析它，两端不会漂移。
      #
      # 阶段 A：先构建 host lua（与设备 so 同一份源码，含定制 VM 重排与
      # 常量盐），把每个 .lua 用 string.dump(f,true) 编译成 strip 调试信息
      # 的字节码再加密 —— unluac 依赖调试信息，strip 后直接失效。
      - name: 构建 host lua（用于 strip 编译）
        run: |
          make -C androlua/src/main/jni/lua all \
            MYCFLAGS="-std=c99 -D_GNU_SOURCE -DLUA_USE_LINUX" MYLIBS="-ldl" \
            -j"$(nproc)"
          test -x androlua/src/main/jni/lua/lua

      - name: 加密 Lua 脚本
        run: |
          set -euo pipefail
          # 先自测，密钥/算法一旦对不上立刻红，不要等装到机器上才发现
          python3 native/luaenc/pack.py selftest
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "加密 $APK 内的 .lua（strip 编译 + 加密）"
          python3 native/luaenc/pack.py enc-apk "$APK" "$RUNNER_TEMP/enc.apk" \
            --lua androlua/src/main/jni/lua/lua
          mv "$RUNNER_TEMP/enc.apk" "$APK"
          # 断言：APK 内每个 .lua 都已是密文、且能解回
          python3 native/luaenc/pack.py verify-apk "$APK"

      # 不再依赖已停更的第三方签名 Action
      - name: 签名APK文件
        if: steps.check_key.outputs.available == 'true'
        id: sign_app
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          echo "使用 build-tools $BUILD_TOOLS"

          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"

          UNSIGNED="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          SIGNED="$RUNNER_TEMP/app-release-signed.apk"

          # -P 16：so 在 APK 内按 16KB 页边界对齐，供系统直接从 APK mmap 时使用。
          # 本工程 extractNativeLibs=true（Lua 的 require 需要 so 真实落盘），
          # 此时 so 在 APK 里是压缩存储的、由系统解压到 nativeLibraryDir，
          # zip 条目对齐其实用不上；但保留 -P 以免将来改回 false 时忘记。
          # -P 需要 build-tools 35+，低版本回退到 -p。
          #
          # 注意别写成 zipalign --help | grep -q：grep -q 命中即退出会让
          # zipalign 收到 SIGPIPE，在 set -o pipefail 下整条管道返回非零，
          # 于是明明支持 -P 也会被误判成不支持。先把输出存下来再判断。
          ZA_HELP="$("$TOOLS/zipalign" --help 2>&1 || true)"
          if grep -q -- '-P' <<<"$ZA_HELP"; then
            "$TOOLS/zipalign" -P 16 -f 4 "$UNSIGNED" "$ALIGNED"
          else
            echo "::warning::build-tools $BUILD_TOOLS 不支持 -P，回退到 -p（4KB）"
            "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          fi
          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose "$SIGNED"

          echo "signedReleaseFile=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: 上传已签名安装包
        if: steps.check_key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 安装包
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: 上传未签名安装包
        if: steps.check_key.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 安装包-未签名
          path: app/build/outputs/apk/**/*.apk
