apply plugin: 'com.android.application'

android {
    namespace 'rx.team.renxinyileng.box'
    compileSdk rootProject.ext.compile_sdk

    defaultConfig {
        applicationId "rx.team.renxinyileng.box"
        minSdk rootProject.ext.min_sdk
        //原作者没更新到最新安卓版本一动就死
        targetSdk rootProject.ext.target_sdk
        versionCode 20260807
        versionName "1.0.3正式版"
        // 注意:AndroLua 的 LuaApplication.updateAssets() 只在 versionName 变化时
        // 才把 APK 内 assets 重新解压到 files 目录。改过 assets 下的 lua 脚本后
        // 必须递增 versionName(建议同步递增 versionCode),否则设备上会一直
        // 运行旧脚本,出现 "cannot find 某类" 之类的诡异错误。
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            //不可开混淆一开就炸
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'arm64-v8a' }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'arm64-v8a' }
        }
    }

    packaging {
        jniLibs {
            // 必须让 so 解压到 nativeLibraryDir，不能留在 APK 里。
            //
            // AndroLua 的 14 个 Lua C 模块（libsocket.so、libcjson.so 等）不是
            // 用 System.loadLibrary 加载的，而是 Lua 的 require 走 package.cpath
            // 找过去 —— 那是文件系统路径，so 必须真实落盘。
            //
            // AGP 在 minSdk >= 23 时默认 extractNativeLibs=false，so 留在 APK
            // 内不落盘。此时 System.loadLibrary 照常能用（libluajava.so 就是
            // 这么加载的），但 require 一律找不到，main.lua:11 的
            // require("socket") 直接失败、整个脚本中断。
            //
            // 原工程 minSdk 是 21（AGP 因此保持 extractNativeLibs=true）所以从
            // 没暴露；本次为了 Material 1.14 抬到 23 才触发。
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 本地 jar：AndroLua 生态里没有 Maven 发布的部分
    //   LuaGoMyServer.jar  —— main.lua:112 用它在 8080 端口伺服 AriaNg
    //   zip4j.jar          —— 被 import "org.manalua.util.zip4j" 使用。
    //                         注意这是 org.manalua 重打包版，与 Maven 上的
    //                         net.lingala.zip4j 包名不同，不能互相替代
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation project(':androlua')

    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_version"
    implementation "com.google.android.material:material:$rootProject.ext.material_version"
    // hs.lua 用到，原先靠 assets 里的 android-support-v4.dex 提供，
    // 那种从可写目录加载 dex 的方式已被 Android 拒绝
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$rootProject.ext.swiperefreshlayout_version"
    implementation "es.voghdev.pdfviewpager:library:$rootProject.ext.pdfviewpager_version"
    // Google 官方播放器 Media3 ExoPlayer,替换阿里云播放器 AliyunPlayer(7.16.0)
    implementation "androidx.media3:media3-exoplayer:$rootProject.ext.media3_version"
    implementation "androidx.media3:media3-ui:$rootProject.ext.media3_version"
    implementation "com.tencent.tbs:tbssdk:$rootProject.ext.tbssdk_version"

    // okhttp 保持 3.x：Lua 脚本按 Java 风格调用 response.code()/body().string()，
    // 4.x 起这些方法被 Kotlin 属性取代，Java/Lua 侧无法调用。
    implementation "com.squareup.okhttp3:okhttp:$rootProject.ext.okhttp_version"
}

// ---------------------------------------------------------------------------
// 本地打包自动加密 Lua 脚本
//
// assembleRelease 之后，对产出的 release APK 把所有 .lua 条目改写成密文
//（用 native/luaenc/pack.py，与 CI、与设备端 luaenc.c 同算法同密钥）。
// 选在 APK 层做而不是 sourceSet 层：构建 app 时 AGP 会把 androlua 模块的
// resources/lua 也并进最终 APK，只有在 APK 层改写才能把各模块的 .lua 一网打尽。
//
// 安全性：
//   - pack.py 幂等（已加密的按 tag 认出、跳过），CI 里签名前还有一道 enc-apk +
//     verify-apk，本 task 先跑到只是让那一步变成空操作，双保险不冲突。
//   - pack.py 若发现 APK 已带签名块会直接拒绝（改写会破坏签名），所以只处理
//     未签名的 release 产物；本地若配了 signingConfig 签了名，这里会跳过并告警，
//     绝不损坏已签名包。正常本地流程是产未签名包→加密→再签名，与 CI 一致。
//   - 缺 python3 时只告警、不失败（本地照常出包，只是没加密；CI 有 python3）。
tasks.register("encryptReleaseLua") {
    description = "把 release APK 内的 .lua 改写成密文（本地打包自动加密）"
    doLast {
        def packPy = file("${rootProject.projectDir}/native/luaenc/pack.py")
        def apkDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
        if (!packPy.exists()) { logger.warn("luaenc: 找不到 ${packPy}，跳过"); return }
        if (!apkDir.exists()) { logger.warn("luaenc: 找不到 ${apkDir}，跳过"); return }
        def apks = apkDir.listFiles()?.findAll { it.name.endsWith(".apk") } ?: []
        if (apks.isEmpty()) { logger.warn("luaenc: release 目录下没有 apk，跳过"); return }
        apks.each { apk ->
            def tmp = new File(apk.parentFile, apk.name + ".enc.tmp")
            // doLast 闭包的 delegate 是 Task，没有 exec()；显式用 project.exec。
            // 本工程未开 configuration-cache（只开了 build cache），可安全在
            // 执行期访问 project。
            def result = project.exec {
                commandLine "python3", packPy.absolutePath, "enc-apk", apk.absolutePath, tmp.absolutePath
                ignoreExitValue = true
            }
            if (result.exitValue == 0 && tmp.exists()) {
                apk.delete(); tmp.renameTo(apk)
                logger.lifecycle("luaenc: 已加密 ${apk.name}")
            } else {
                tmp.delete()
                logger.warn("luaenc: 跳过 ${apk.name}（可能已签名，或缺 python3；退出码 ${result.exitValue}）")
            }
        }
    }
}
tasks.matching { it.name == "assembleRelease" }.configureEach { finalizedBy("encryptReleaseLua") }
