apply plugin: 'com.android.application'

android {
    namespace 'rx.team.renxinyileng.box'
    compileSdk rootProject.ext.compile_sdk

    defaultConfig {
        applicationId "rx.team.renxinyileng.box"
        minSdk rootProject.ext.min_sdk
        //原作者没更新到最新安卓版本一动就死
        targetSdk rootProject.ext.target_sdk
        versionCode 20231120
        versionName "1.0.0正式版"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            //不可开混淆一开就炸
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'arm64-v8a' }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { abiFilters 'arm64-v8a' }
        }
    }

    packaging {
        jniLibs {
            // 必须让 so 解压到 nativeLibraryDir，不能留在 APK 里。
            //
            // AndroLua 的 14 个 Lua C 模块（libsocket.so、libcjson.so 等）不是
            // 用 System.loadLibrary 加载的，而是 Lua 的 require 走 package.cpath
            // 找过去 —— 那是文件系统路径，so 必须真实落盘。
            //
            // AGP 在 minSdk >= 23 时默认 extractNativeLibs=false，so 留在 APK
            // 内不落盘。此时 System.loadLibrary 照常能用（libluajava.so 就是
            // 这么加载的），但 require 一律找不到，main.lua:11 的
            // require("socket") 直接失败、整个脚本中断。
            //
            // 原工程 minSdk 是 21（AGP 因此保持 extractNativeLibs=true）所以从
            // 没暴露；本次为了 Material 1.14 抬到 23 才触发。
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 本地 jar：AndroLua 生态里没有 Maven 发布的部分
    //   LuaGoMyServer.jar  —— main.lua:112 用它在 8080 端口伺服 AriaNg
    //   zip4j.jar          —— 被 import "org.manalua.util.zip4j" 使用。
    //                         注意这是 org.manalua 重打包版，与 Maven 上的
    //                         net.lingala.zip4j 包名不同，不能互相替代
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation project(':androlua')

    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompat_version"
    implementation "com.google.android.material:material:$rootProject.ext.material_version"
    // hs.lua 用到，原先靠 assets 里的 android-support-v4.dex 提供，
    // 那种从可写目录加载 dex 的方式已被 Android 拒绝
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$rootProject.ext.swiperefreshlayout_version"
    implementation "es.voghdev.pdfviewpager:library:$rootProject.ext.pdfviewpager_version"
    implementation "com.aliyun.sdk.android:AliyunPlayer:$rootProject.ext.aliyun_player_version"
    implementation "com.tencent.tbs:tbssdk:$rootProject.ext.tbssdk_version"

    // okhttp 保持 3.x：Lua 脚本按 Java 风格调用 response.code()/body().string()，
    // 4.x 起这些方法被 Kotlin 属性取代，Java/Lua 侧无法调用。
    implementation "com.squareup.okhttp3:okhttp:$rootProject.ext.okhttp_version"
}
